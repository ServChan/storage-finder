name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew clean build --warning-mode all --console=plain

      - name: Upload distributable jars
        uses: actions/upload-artifact@v4
        with:
          name: storage-finder-jars
          path: |
            build/libs/*.jar
          if-no-files-found: error

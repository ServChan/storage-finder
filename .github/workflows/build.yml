name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.1.2", "26.2"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew clean build "-Pminecraft_version=${{ matrix.minecraft }}" --warning-mode all --console=plain

      - name: Upload distributable jars
        if: matrix.minecraft == '26.1.2'
        uses: actions/upload-artifact@v4
        with:
          name: storage-finder-jars
          path: |
            build/libs/*.jar
          if-no-files-found: error

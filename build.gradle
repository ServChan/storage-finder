import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def modVersion = project.version.toString()
def fabricLifecycleEventsVersion = project.property("fabric_lifecycle_events_version")
def fabricRenderingVersion = project.property("fabric_rendering_version")
def fabricKeyMappingApiVersion = project.property("fabric_key_mapping_api_version")
def localModMenu = file(project.modmenu_jar)

base { archivesName = project.archives_base_name }

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

loom {
    splitEnvironmentSourceSets()
}

sourceSets {
    macro {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}

loom {
    mods {
        "storagefinder" { sourceSet sourceSets.client }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${fabricLifecycleEventsVersion}"
    implementation "net.fabricmc.fabric-api:fabric-rendering-v1:${fabricRenderingVersion}"
    implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${fabricKeyMappingApiVersion}"
    if (localModMenu.isFile()) {
        compileOnly files(localModMenu)
    } else {
        compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
            transitive = false
        }
    }
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(ProcessResources).configureEach {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") { expand "version": modVersion }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xlint:deprecation"]
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    from(rootProject.file("LICENSE")) {
        rename { "LICENSE_storagefinder" }
    }
}

def macroClasses = "org/lts/storagefinder/macro/**"

jar {
    doLast {
        def leaked = zipTree(archiveFile.get().asFile).matching {
            include macroClasses
            include "storagefinder.macro.mixins.json"
        }.files
        if (!leaked.isEmpty()) {
            throw new GradleException("Macro classes leaked into the standard jar: ${leaked*.name}")
        }
    }
}

def macroModJson = tasks.register("macroModJson") {
    def source = file("src/client/resources/fabric.mod.json")
    def target = layout.buildDirectory.file("generated/macro/fabric.mod.json")
    inputs.file source
    inputs.property "version", modVersion
    outputs.file target
    doLast {
        def json = new JsonSlurper().parse(source)
        json.version = modVersion
        json.name = "Storage Finder (macro)"
        json.description = json.description + " Macro edition: reads nearby storage while you walk past, without opening a screen."
        json.entrypoints.client = json.entrypoints.client + ["org.lts.storagefinder.macro.AutoPeekClient"]
        json.mixins = json.mixins + [[config: "storagefinder.macro.mixins.json", environment: "client"]]
        def out = target.get().asFile
        out.parentFile.mkdirs()
        out.setText(JsonOutput.prettyPrint(JsonOutput.toJson(json)), "UTF-8")
    }
}

def macroJar = tasks.register("macroJar", Zip) {
    group = "build"
    description = "Builds the macro edition that reads nearby storage without opening a screen."
    dependsOn tasks.named("jar"), tasks.named("macroClasses"), macroModJson
    archiveBaseName = project.archives_base_name
    archiveVersion = modVersion
    archiveClassifier = "macro"
    archiveExtension = "jar"
    destinationDirectory = tasks.named("jar", Jar).flatMap { it.destinationDirectory }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(zipTree(tasks.named("jar", Jar).flatMap { it.archiveFile })) {
        exclude "fabric.mod.json"
    }
    from(sourceSets.macro.output)
    from(macroModJson)
    doLast {
        def included = zipTree(archiveFile.get().asFile).matching { include macroClasses }.files
        if (included.isEmpty()) {
            throw new GradleException("Macro classes are missing from the macro jar")
        }
    }
}

tasks.named("assemble") {
    dependsOn macroJar
}

tasks.register("verifyProjectMetadata") {
    group = "verification"
    description = "Checks localization parity and release metadata consistency."
    doLast {
        def slurper = new JsonSlurper()
        ["src/client/resources/assets/storagefinder/lang",
         "src/macro/resources/assets/storagefinder_macro/lang"].each { path ->
            def languageDir = file(path)
            def englishKeys = slurper.parse(file("${languageDir}/en_us.json")).keySet()
            fileTree(languageDir).matching { include "*.json" }.files.each { languageFile ->
                def keys = slurper.parse(languageFile).keySet()
                if (keys != englishKeys) {
                    throw new GradleException("Localization keys differ in ${path}/${languageFile.name}")
                }
            }
        }

        def readme = file("README.md").getText("UTF-8").toLowerCase(Locale.ROOT)
        if (!readme.contains("version-${modVersion}-")
                || !readme.contains("storage-finder-${modVersion}.jar")) {
            throw new GradleException("README release version does not match ${modVersion}")
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("verifyProjectMetadata")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
